<script>
  function renderPostMath(root) {
    const typeset = () => {
      if (window.MathJax?.typesetPromise) {
        Promise.resolve(window.MathJax.startup?.promise)
          .then(() => window.MathJax.typesetPromise([root]));
      }
    };

    if (window.MathJax?.typesetPromise) {
      typeset();
    } else {
      document.getElementById("mathjax-script")?.addEventListener("load", typeset, { once: true });
    }
  }

  document.addEventListener("post-lock:unlocked", (event) => {
    renderPostMath(event.detail?.root || document);
  });
</script>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

  mermaid.initialize({
    startOnLoad: false,
    theme: "base",
    securityLevel: "strict",
    themeVariables: {
      background: "#fffdf7",
      primaryColor: "#f4efe5",
      primaryTextColor: "#28323d",
      primaryBorderColor: "#a99b86",
      lineColor: "#6f7b86",
      secondaryColor: "#edf3f5",
      tertiaryColor: "#fbf4e7",
      fontFamily: "Georgia, Noto Serif KR, Batang, serif"
    }
  });

  let mermaidSequence = 0;

  async function renderMermaid(root = document) {
    const blocks = root.querySelectorAll("pre > code.language-mermaid");
    blocks.forEach((block) => {
      const container = document.createElement("div");
      container.className = "mermaid";
      container.id = `mermaid-${mermaidSequence++}`;
      container.textContent = block.textContent;
      block.parentElement.replaceWith(container);
    });

    if (blocks.length > 0) {
      const pending = Array.from(root.querySelectorAll(".mermaid:not([data-processed='true'])"));
      if (pending.length > 0) {
        await mermaid.run({ nodes: pending });
      }
    }
  }

  window.renderPostMermaid = renderMermaid;
  document.addEventListener("post-lock:unlocked", (event) => {
    const root = event.detail?.root || document;
    renderMermaid(root);
  });
  renderMermaid();
</script>

<script>
  // 마우스 우클릭 방지
  document.addEventListener('contextmenu', function(e) {
    if (e.target.closest('.web-playground')) return;
    e.preventDefault();
  });

  // 드래그 시작 방지
  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
  });

  // 복사(Copy) 이벤트 차단
  document.addEventListener('copy', function(e) {
    if (e.target.closest('.web-playground')) return;
    e.preventDefault();
  });

  // 키보드 단축키 차단 (Ctrl+C, Ctrl+A, Ctrl+S, Ctrl+U, Ctrl+P, F12, 개발자도구 등)
  document.addEventListener('keydown', function(e) {
    if (e.target.closest('.web-playground')) return;
    // F12 키 차단
    if (e.key === 'F12') {
      e.preventDefault();
      return;
    }

    if (e.ctrlKey || e.metaKey) {
      // Ctrl+P (인쇄), Ctrl+C (복사), Ctrl+A (전체선택), Ctrl+U (소스보기), Ctrl+S (저장) 차단
      if (['c', 'C', 'a', 'A', 'u', 'U', 's', 'S', 'p', 'P'].includes(e.key)) {
        e.preventDefault();
        return;
      }
      // 개발자 도구 단축키 (Ctrl+Shift+I / J / C) 차단
      if (e.shiftKey && ['i', 'I', 'j', 'J', 'c', 'C'].includes(e.key)) {
        e.preventDefault();
        return;
      }
    }
  });
</script>
