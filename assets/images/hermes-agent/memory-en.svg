<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" role="img" aria-labelledby="title desc"><title id="title">Two memories: you and the work</title><desc id="desc">USER.md stores user preferences; MEMORY.md stores learned work facts.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526b7a" stroke-width="2"/></marker></defs><rect width="640" height="490" rx="20" fill="#f7f5ef"/><g font-family="'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif" fill="#253746"><text x="28" y="48" font-size="28" font-weight="700">Think of memory as two notebooks</text><rect x="28" y="76" width="584" height="140" rx="14" fill="#e0edf5"/><text x="50" y="114" font-size="27" font-weight="700">USER.md</text><text x="50" y="156" font-size="23" font-weight="400">Notes about you</text><text x="50" y="190" font-size="21" font-weight="400">Example: concise replies in Korean</text><rect x="28" y="236" width="584" height="140" rx="14" fill="#e4eee3"/><text x="50" y="274" font-size="27" font-weight="700">MEMORY.md</text><text x="50" y="316" font-size="23" font-weight="400">Notes about the work</text><text x="50" y="350" font-size="21" font-weight="400">Example: reports live in /home/hermes/reports</text><text x="32" y="423" font-size="22" font-weight="400">Useful facts carry into a new conversation.</text><text x="32" y="458" font-size="22" font-weight="400">Keep passwords and API keys elsewhere.</text></g></svg>

