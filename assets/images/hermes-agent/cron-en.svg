<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc"><title id="title">Cron: when, where, and with which input</title><desc id="desc">At the scheduled time, select the working folder and input. An agent reasons; no-agent runs only a script.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526b7a" stroke-width="2"/></marker></defs><rect width="640" height="820" rx="20" fill="#f7f5ef"/><g font-family="'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif" fill="#253746"><text x="28" y="48" font-size="28" font-weight="700">Cron = work at a scheduled time</text><rect x="28" y="74" width="584" height="92" rx="14" fill="#e0edf5"/><text x="50" y="111" font-size="25" font-weight="700">1. When?</text><text x="50" y="147" font-size="23" font-weight="400">Every day at 09:00 · Asia/Seoul</text><path d="M320 171V197" stroke="#526b7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="208" width="584" height="116" rx="14" fill="#e4eee3"/><text x="50" y="247" font-size="25" font-weight="700">2. Where?  --workdir</text><text x="50" y="286" font-size="24" font-weight="400">/home/hermes/reports</text><path d="M320 329V355" stroke="#526b7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="366" width="584" height="116" rx="14" fill="#f4e8d6"/><text x="50" y="405" font-size="25" font-weight="700">3. Earlier output?  context_from</text><text x="50" y="444" font-size="22" font-weight="400">Pass another job's latest output to the AI</text><path d="M320 487V513" stroke="#526b7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="524" width="584" height="170" rx="14" fill="#e8e4f0"/><text x="50" y="562" font-size="25" font-weight="700">4. How should it run?</text><text x="50" y="605" font-size="23" font-weight="400">Agent job → read, reason, summarize</text><text x="50" y="646" font-size="23" font-weight="400">--no-agent → run the script only</text><text x="32" y="741" font-size="22" font-weight="400">Result → selected Telegram chat or file</text><text x="32" y="783" font-size="21" font-weight="400">Choose the options you need; all are optional.</text></g></svg>

