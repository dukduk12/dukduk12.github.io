<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc"><title id="title">Cron: 언제, 어디서, 무엇을 참고해 실행할까</title><desc id="desc">예약 시각이 되면 작업 폴더와 이전 결과를 준비합니다. AI 작업은 모델이 처리하고 no-agent는 스크립트만 실행합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526b7a" stroke-width="2"/></marker></defs><rect width="640" height="820" rx="20" fill="#f7f5ef"/><g font-family="'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif" fill="#253746"><text x="28" y="48" font-size="28" font-weight="700">Cron = 정해진 시간에 하는 일</text><rect x="28" y="74" width="584" height="92" rx="14" fill="#e0edf5"/><text x="50" y="111" font-size="25" font-weight="700">1. 언제?</text><text x="50" y="147" font-size="23" font-weight="400">매일 09:00 · Asia/Seoul</text><path d="M320 171V197" stroke="#526b7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="208" width="584" height="116" rx="14" fill="#e4eee3"/><text x="50" y="247" font-size="25" font-weight="700">2. 어디서?  --workdir</text><text x="50" y="286" font-size="24" font-weight="400">/home/hermes/reports</text><path d="M320 329V355" stroke="#526b7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="366" width="584" height="116" rx="14" fill="#f4e8d6"/><text x="50" y="405" font-size="25" font-weight="700">3. 이전 결과?  context_from</text><text x="50" y="444" font-size="22" font-weight="400">다른 작업의 최근 결과를 AI에 전달</text><path d="M320 487V513" stroke="#526b7a" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="524" width="584" height="170" rx="14" fill="#e8e4f0"/><text x="50" y="562" font-size="25" font-weight="700">4. 어떻게 실행할까?</text><text x="50" y="605" font-size="23" font-weight="400">AI 작업 → 읽고 판단하고 요약</text><text x="50" y="646" font-size="23" font-weight="400">--no-agent → 스크립트만 실행</text><text x="32" y="741" font-size="22" font-weight="400">결과 → 지정한 Telegram 대화 또는 파일</text><text x="32" y="783" font-size="21" font-weight="400">필요한 옵션만 선택합니다. 모두 필수는 아닙니다.</text></g></svg>

