<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Nuclide notation</title>
  <desc id="desc">Mass number, atomic number, element symbol, and ionic charge around sodium.</desc>
  <rect width="960" height="430" rx="28" fill="#f5f8fc"/>
  <text x="480" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">Nuclide notation · 원자 표시법</text>
  <text x="472" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="112" font-weight="700" fill="#153e75">Na</text>
  <text x="372" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" fill="#b83232">23</text>
  <text x="372" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" fill="#2b6cb0">11</text>
  <text x="565" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" fill="#6b46c1">+</text>
  <path d="M340 145H210" stroke="#b83232" stroke-width="3"/>
  <path d="M340 270H210" stroke="#2b6cb0" stroke-width="3"/>
  <path d="M590 150H735" stroke="#6b46c1" stroke-width="3"/>
  <path d="M515 280v70h150" stroke="#153e75" stroke-width="3" fill="none"/>
  <text x="198" y="137" text-anchor="end" font-family="Arial,sans-serif" font-size="23" fill="#6b1f1f">Mass number A</text>
  <text x="198" y="164" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#6b1f1f">질량수 = p + n</text>
  <text x="198" y="263" text-anchor="end" font-family="Arial,sans-serif" font-size="23" fill="#174a78">Atomic number Z</text>
  <text x="198" y="290" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#174a78">원자번호 = p</text>
  <text x="748" y="143" font-family="Arial,sans-serif" font-size="23" fill="#50328a">Ionic charge q</text>
  <text x="748" y="170" font-family="Arial,sans-serif" font-size="20" fill="#50328a">이온 전하 = p − e</text>
  <text x="678" y="344" font-family="Arial,sans-serif" font-size="23" fill="#153e75">Element symbol · 원소 기호</text>
  <text x="480" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#334e68">²³₁₁Na⁺: 11 protons, 12 neutrons, 10 electrons</text>
</svg>
