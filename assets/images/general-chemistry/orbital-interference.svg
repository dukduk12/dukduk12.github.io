<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
  <title id="title">Constructive and destructive orbital interference with relative energies and nodes</title>
  <desc id="desc">Same-phase atomic orbitals combine constructively into a lower-energy bonding molecular orbital with density between nuclei. Opposite-phase orbitals combine destructively into a higher-energy antibonding orbital with an internuclear node.</desc>
  <defs><style>.p{fill:#2563eb;opacity:.78}.m{fill:#f97316;opacity:.78}.n{fill:#111827}.a{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.lev{stroke:#0f172a;stroke-width:4}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5}.t{font:18px system-ui,sans-serif;fill:#0f172a}.s{font:15px system-ui,sans-serif;fill:#334155}.b{font-weight:700}.panel{fill:#f8fafc;stroke:#cbd5e1}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#64748b"/></marker></defs>
  <rect width="1180" height="600" fill="#fff" rx="18"/>
  <rect class="panel" x="25" y="25" width="800" height="250" rx="14"/><rect class="panel" x="25" y="300" width="800" height="250" rx="14"/>
  <text class="t b" x="52" y="62">Constructive interference: ψA + ψB → bonding MO</text>
  <ellipse class="p" cx="130" cy="150" rx="58" ry="40"/><ellipse class="p" cx="270" cy="150" rx="58" ry="40"/><circle class="n" cx="130" cy="150" r="7"/><circle class="n" cx="270" cy="150" r="7"/>
  <line class="a" x1="345" y1="150" x2="425" y2="150"/><ellipse class="p" cx="610" cy="150" rx="155" ry="70"/><circle class="n" cx="560" cy="150" r="7"/><circle class="n" cx="660" cy="150" r="7"/>
  <text class="s" x="82" y="220">same phase</text><text class="s b" x="470" y="245">density between nuclei ↑ · no internuclear node</text>
  <text class="t b" x="52" y="337">Destructive interference: ψA − ψB → antibonding MO</text>
  <ellipse class="p" cx="130" cy="425" rx="58" ry="40"/><ellipse class="m" cx="270" cy="425" rx="58" ry="40"/><circle class="n" cx="130" cy="425" r="7"/><circle class="n" cx="270" cy="425" r="7"/>
  <line class="a" x1="345" y1="425" x2="425" y2="425"/><ellipse class="p" cx="535" cy="425" rx="85" ry="62"/><ellipse class="m" cx="685" cy="425" rx="85" ry="62"/><line class="dash" x1="610" y1="350" x2="610" y2="500"/><circle class="n" cx="560" cy="425" r="7"/><circle class="n" cx="660" cy="425" r="7"/>
  <text class="s" x="75" y="495">opposite phase</text><text class="s b" x="495" y="525">node: ψ = 0 · density between nuclei ↓</text>
  <text class="t b" x="885" y="58">Relative MO energy</text><line x1="870" y1="525" x2="870" y2="90" class="a"/>
  <line class="lev" x1="930" y1="145" x2="1090" y2="145"/><text class="t b" x="945" y="130">σ* antibonding</text><text class="s" x="945" y="174">higher energy</text><text class="s" x="945" y="197">destructive · node</text>
  <line class="lev" x1="950" y1="305" x2="1070" y2="305"/><text class="s" x="965" y="335">parent AO energy</text>
  <line class="lev" x1="930" y1="475" x2="1090" y2="475"/><text class="t b" x="948" y="460">σ bonding</text><text class="s" x="945" y="505">lower energy</text><text class="s" x="945" y="528">constructive · stabilized</text>
</svg>
