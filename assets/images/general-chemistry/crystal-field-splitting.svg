<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Crystal field splitting</title><desc id="d">Comparison of octahedral and tetrahedral d orbital energy splitting.</desc><defs><style>.bg{fill:#07182d}.h{fill:#fff;font:700 30px Arial}.txt{fill:#dceeff;font:20px Arial}.level{stroke:#65d6ff;stroke-width:7}.guide{stroke:#7898b5;stroke-width:2;stroke-dasharray:8 8}.e{stroke:#ffbd59;stroke-width:4;marker-end:url(#m)}.orb{fill:#fff;font:700 19px Arial;text-anchor:middle}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffbd59"/></marker></defs>
<rect class="bg" width="1200" height="720" rx="24"/><text class="h" x="55" y="60">CRYSTAL-FIELD SPLITTING · 결정장 갈라짐</text><line class="e" x1="70" y1="620" x2="70" y2="115"/><text class="txt" transform="translate(42 390) rotate(-90)">energy · 에너지</text>
<g transform="translate(125)"><text class="h" x="190" y="135">Octahedral · 팔면체</text><line class="guide" x1="40" y1="355" x2="420" y2="355"/><line class="level" x1="100" y1="250" x2="185" y2="250"/><line class="level" x1="275" y1="250" x2="360" y2="250"/><text class="orb" x="142" y="225">d(z²)</text><text class="orb" x="317" y="225">d(x²−y²)</text><text class="txt" x="430" y="258">e<tspan baseline-shift="sub">g</tspan></text><line class="level" x1="65" y1="455" x2="150" y2="455"/><line class="level" x1="190" y1="455" x2="275" y2="455"/><line class="level" x1="315" y1="455" x2="400" y2="455"/><text class="orb" x="107" y="490">d(xy)</text><text class="orb" x="232" y="490">d(xz)</text><text class="orb" x="357" y="490">d(yz)</text><text class="txt" x="430" y="463">t<tspan baseline-shift="sub">2g</tspan></text><line class="e" x1="465" y1="450" x2="465" y2="255"/><text class="txt" x="480" y="360">Δ<tspan baseline-shift="sub">o</tspan></text></g>
<g transform="translate(670)"><text class="h" x="175" y="135">Tetrahedral · 정사면체</text><line class="guide" x1="40" y1="355" x2="420" y2="355"/><line class="level" x1="65" y1="265" x2="150" y2="265"/><line class="level" x1="190" y1="265" x2="275" y2="265"/><line class="level" x1="315" y1="265" x2="400" y2="265"/><text class="orb" x="107" y="240">d(xy)</text><text class="orb" x="232" y="240">d(xz)</text><text class="orb" x="357" y="240">d(yz)</text><text class="txt" x="430" y="273">t<tspan baseline-shift="sub">2</tspan></text><line class="level" x1="100" y1="445" x2="185" y2="445"/><line class="level" x1="275" y1="445" x2="360" y2="445"/><text class="orb" x="142" y="480">d(z²)</text><text class="orb" x="317" y="480">d(x²−y²)</text><text class="txt" x="430" y="453">e</text><line class="e" x1="465" y1="440" x2="465" y2="270"/><text class="txt" x="480" y="360">Δ<tspan baseline-shift="sub">t</tspan></text></g>
<text class="txt" x="155" y="655">Δ vs pairing energy determines high/low spin; electron count determines unpaired electrons and magnetism.</text>
</svg>
