<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">s, 세 p, 다섯 d 오비탈의 공간적 모양</title>
  <desc id="desc">s 오비탈의 구형, px py pz의 세 방향, dxy dxz dyz dx2-y2의 네 엽과 dz2의 두 엽 및 고리.</desc>
  <defs>
    <g id="pH"><ellipse cx="-48" cy="0" rx="55" ry="30" fill="#3978c5" fill-opacity=".82"/><ellipse cx="48" cy="0" rx="55" ry="30" fill="#d94f55" fill-opacity=".82"/><circle r="4" fill="#172033"/></g>
    <g id="d4"><ellipse cx="-38" cy="-38" rx="48" ry="23" fill="#3978c5" fill-opacity=".82" transform="rotate(45 -38 -38)"/><ellipse cx="38" cy="-38" rx="48" ry="23" fill="#d94f55" fill-opacity=".82" transform="rotate(-45 38 -38)"/><ellipse cx="-38" cy="38" rx="48" ry="23" fill="#d94f55" fill-opacity=".82" transform="rotate(-45 -38 38)"/><ellipse cx="38" cy="38" rx="48" ry="23" fill="#3978c5" fill-opacity=".82" transform="rotate(45 38 38)"/><circle r="4" fill="#172033"/></g>
  </defs>
  <rect width="1400" height="850" fill="#fff"/><text x="700" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">s, p, d 오비탈의 대표 경계면</text>
  <g font-family="sans-serif" fill="#172033" text-anchor="middle">
    <g transform="translate(170 190)"><circle r="88" fill="#3978c5" fill-opacity=".76" stroke="#245799" stroke-width="3"/><circle r="4"/><text y="135" font-size="20">s</text><text y="158" font-size="14" fill="#475569">구형 · 방향성 없음</text></g>
    <g transform="translate(470 190)"><use href="#pH"/><text y="135" font-size="20">pₓ</text></g>
    <g transform="translate(760 190)"><use href="#pH" transform="rotate(90)"/><text y="135" font-size="20">pᵧ</text></g>
    <g transform="translate(1050 190)"><use href="#pH" transform="rotate(-45)"/><text y="135" font-size="20">pᶻ</text><text y="158" font-size="14" fill="#475569">z축을 화면에 기울여 표시</text></g>
    <g transform="translate(170 515)"><use href="#d4"/><text y="145" font-size="20">dₓᵧ</text><text y="168" font-size="14" fill="#475569">엽이 x·y축 사이</text></g>
    <g transform="translate(430 515)"><use href="#d4" transform="rotate(-22)"/><text y="145" font-size="20">dₓᶻ</text></g>
    <g transform="translate(690 515)"><use href="#d4" transform="rotate(22)"/><text y="145" font-size="20">dᵧᶻ</text></g>
    <g transform="translate(950 515)"><use href="#d4" transform="rotate(45)"/><text y="145" font-size="20">dₓ²₋ᵧ²</text><text y="168" font-size="14" fill="#475569">엽이 x·y축 위</text></g>
    <g transform="translate(1210 515)"><ellipse cy="-55" rx="32" ry="76" fill="#3978c5" fill-opacity=".82"/><ellipse cy="55" rx="32" ry="76" fill="#d94f55" fill-opacity=".82"/><ellipse rx="78" ry="24" fill="none" stroke="#d6a31d" stroke-width="18"/><circle r="4" fill="#172033"/><text y="145" font-size="20">dᶻ²</text><text y="168" font-size="14" fill="#475569">z축 두 엽 + xy 고리</text></g>
  </g>
  <g font-family="sans-serif" fill="#475569" font-size="15"><text x="80" y="755">p 오비탈은 핵을 지나는 마디면 하나를, d 오비탈은 각 마디 두 개를 가진다.</text><text x="80" y="782">파랑과 빨강은 전하가 아니라 파동함수 ψ의 반대 부호(위상)다. 마디에서는 ψ=0이므로 |ψ|²=0이다.</text><text x="80" y="809">경계면은 오비탈의 끝이 아니라 전자 확률을 일정 비율 포함하도록 정한 표면이다.</text></g>
</svg>
