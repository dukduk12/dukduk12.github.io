<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Atomic and molecular orbital energy diagrams for H2, HF, and NO</title>
  <desc id="desc">Each panel places atomic orbitals on the outer columns and molecular orbitals in the center. HF shows low fluorine 2s and 2p levels, hydrogen 1s at higher energy, and mixing only between hydrogen 1s and the axial fluorine 2p orbital.</desc>
  <defs>
    <style>.level{stroke:#0f172a;stroke-width:3}.connect{stroke:#94a3b8;stroke-width:1.5}.weak{stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:5 5}.electron{stroke:#2563eb;stroke-width:3}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.title{font:700 22px system-ui,sans-serif;fill:#0f172a}.label{font:15px system-ui,sans-serif;fill:#0f172a}.small{font:13px system-ui,sans-serif;fill:#475569}.note{font:14px system-ui,sans-serif;fill:#334155}.head{font:700 14px system-ui,sans-serif;fill:#334155}</style>
  </defs>
  <rect width="1200" height="840" fill="#fff" rx="18"/>
  <text class="title" x="40" y="42">Energy ↑</text>

  <!-- H2 -->
  <rect class="panel" x="25" y="65" width="350" height="735" rx="14"/>
  <text class="title" x="175" y="102">H₂</text>
  <text class="head" x="52" y="137">H AO</text><text class="head" x="157" y="137">H₂ MO</text><text class="head" x="292" y="137">H AO</text>
  <line class="level" x1="50" y1="430" x2="105" y2="430"/><text class="small" x="64" y="455">1s¹</text>
  <line class="level" x1="270" y1="430" x2="325" y2="430"/><text class="small" x="284" y="455">1s¹</text>
  <line class="level" x1="145" y1="575" x2="235" y2="575"/><text class="label" x="244" y="580">σ1s</text>
  <line class="level" x1="145" y1="255" x2="235" y2="255"/><text class="label" x="244" y="260">σ*1s</text>
  <line class="connect" x1="105" y1="430" x2="145" y2="575"/><line class="connect" x1="270" y1="430" x2="235" y2="575"/>
  <line class="connect" x1="105" y1="430" x2="145" y2="255"/><line class="connect" x1="270" y1="430" x2="235" y2="255"/>
  <line class="electron" x1="174" y1="567" x2="174" y2="538"/><line class="electron" x1="206" y1="567" x2="206" y2="538"/>
  <text class="note" x="85" y="710">2 e⁻ in bonding σ1s</text><text class="note" x="87" y="738">BO = 1 · diamagnetic</text>

  <!-- HF -->
  <rect class="panel" x="395" y="65" width="400" height="735" rx="14"/>
  <text class="title" x="575" y="102">HF</text>
  <text class="head" x="420" y="137">H AO</text><text class="head" x="545" y="137">HF MO</text><text class="head" x="715" y="137">F AO</text>
  <!-- atomic levels -->
  <line class="level" x1="420" y1="330" x2="485" y2="330"/><text class="small" x="430" y="355">H 1s¹</text>
  <line class="level" x1="705" y1="455" x2="770" y2="455"/><text class="small" x="710" y="480">F 2p⁵</text>
  <line class="level" x1="705" y1="650" x2="770" y2="650"/><text class="small" x="713" y="675">F 2s²</text>
  <!-- molecular levels -->
  <line class="level" x1="545" y1="190" x2="635" y2="190"/><text class="small" x="642" y="195">σ* (LUMO)</text>
  <line class="level" x1="545" y1="405" x2="635" y2="405"/><line class="level" x1="545" y1="445" x2="635" y2="445"/><text class="small" x="642" y="430">n(F 2p) HOMO</text>
  <line class="level" x1="545" y1="530" x2="635" y2="530"/><text class="small" x="642" y="535">σ(H–F)</text>
  <line class="level" x1="545" y1="685" x2="635" y2="685"/><text class="small" x="642" y="690">n(F 2s)</text>
  <!-- interactions: H1s only axial F2p -> sigma pair -->
  <line class="connect" x1="485" y1="330" x2="545" y2="190"/><line class="connect" x1="705" y1="455" x2="635" y2="190"/>
  <line class="connect" x1="485" y1="330" x2="545" y2="530"/><line class="connect" x1="705" y1="455" x2="635" y2="530"/>
  <line class="weak" x1="705" y1="455" x2="635" y2="405"/><line class="weak" x1="705" y1="455" x2="635" y2="445"/><line class="weak" x1="705" y1="650" x2="635" y2="685"/>
  <!-- electrons -->
  <g class="electron"><line x1="574" y1="677" x2="574" y2="651"/><line x1="606" y1="677" x2="606" y2="651"/><line x1="574" y1="522" x2="574" y2="496"/><line x1="606" y1="522" x2="606" y2="496"/><line x1="574" y1="397" x2="574" y2="371"/><line x1="606" y1="397" x2="606" y2="371"/><line x1="574" y1="437" x2="574" y2="411"/><line x1="606" y1="437" x2="606" y2="411"/></g>
  <text class="note" x="445" y="735">F orbitals lie lower than H 1s.</text><text class="note" x="438" y="760">Only axial F 2p has σ overlap.</text>

  <!-- NO -->
  <rect class="panel" x="815" y="65" width="360" height="735" rx="14"/>
  <text class="title" x="980" y="102">NO</text>
  <text class="head" x="840" y="137">N AO</text><text class="head" x="936" y="137">NO MO</text><text class="head" x="1090" y="137">O AO</text>
  <text class="small" x="845" y="166">higher</text><text class="small" x="1090" y="166">lower</text>
  <line class="level" x1="915" y1="205" x2="965" y2="205"/><line class="level" x1="995" y1="205" x2="1045" y2="205"/><text class="small" x="1050" y="210">π*2p¹ SOMO</text>
  <line class="level" x1="935" y1="320" x2="1025" y2="320"/><text class="small" x="1032" y="325">σ2p²</text>
  <line class="level" x1="915" y1="405" x2="965" y2="405"/><line class="level" x1="995" y1="405" x2="1045" y2="405"/><text class="small" x="1050" y="410">π2p⁴</text>
  <line class="level" x1="935" y1="535" x2="1025" y2="535"/><text class="small" x="1032" y="540">σ*2s²</text>
  <line class="level" x1="935" y1="635" x2="1025" y2="635"/><text class="small" x="1032" y="640">σ2s²</text>
  <g class="electron"><line x1="938" y1="197" x2="938" y2="171"/><line x1="965" y1="312" x2="965" y2="286"/><line x1="995" y1="312" x2="995" y2="286"/><line x1="934" y1="397" x2="934" y2="371"/><line x1="953" y1="397" x2="953" y2="371"/><line x1="1014" y1="397" x2="1014" y2="371"/><line x1="1033" y1="397" x2="1033" y2="371"/><line x1="965" y1="527" x2="965" y2="501"/><line x1="995" y1="527" x2="995" y2="501"/><line x1="965" y1="627" x2="965" y2="601"/><line x1="995" y1="627" x2="995" y2="601"/></g>
  <line class="level" x1="835" y1="380" x2="885" y2="380"/><line class="level" x1="1090" y1="430" x2="1140" y2="430"/>
  <line class="weak" x1="885" y1="380" x2="915" y2="205"/><line class="weak" x1="1090" y1="430" x2="1045" y2="205"/><line class="weak" x1="885" y1="380" x2="935" y2="635"/><line class="weak" x1="1090" y1="430" x2="1025" y2="635"/>
  <text class="note" x="880" y="710">11 valence e⁻</text><text class="note" x="865" y="738">BO = 2.5 · paramagnetic</text>
</svg>
