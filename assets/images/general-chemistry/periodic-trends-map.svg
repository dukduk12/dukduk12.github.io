<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">주기율표에서 주요 주기적 성질의 증가 방향</title>
  <desc id="desc">원자 반지름, 금속성, 유효핵전하, 첫 이온화 에너지, 전기음성도를 각각 하나의 화살표로 표시한다.</desc>
  <defs>
    <marker id="warm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#b33b32"/></marker>
    <marker id="cool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563a8"/></marker>
    <style>.t{font-family:Arial,'Noto Sans KR',sans-serif}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.label{font-size:20px;font-weight:700;fill:#172033}.note{font-size:14px;fill:#475569}.grid{stroke:#cbd5e1;fill:none}</style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text class="t" x="600" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">주기적 성질: 속성별 증가 방향</text>

  <g transform="translate(40 82)">
    <rect class="card" width="210" height="230" rx="10"/>
    <text class="t label" x="105" y="34" text-anchor="middle">원자 반지름</text>
    <path class="grid" d="M42 70H168V175H42Z M84 70V175 M126 70V175 M42 105H168 M42 140H168"/>
    <path d="M150 88L60 160" stroke="#2563a8" stroke-width="7" marker-end="url(#cool)"/>
    <text class="t note" x="105" y="208" text-anchor="middle">왼쪽 아래로 증가</text>
  </g>
  <g transform="translate(270 82)">
    <rect class="card" width="210" height="230" rx="10"/>
    <text class="t label" x="105" y="34" text-anchor="middle">금속성</text>
    <path class="grid" d="M42 70H168V175H42Z M84 70V175 M126 70V175 M42 105H168 M42 140H168"/>
    <path d="M150 88L60 160" stroke="#2563a8" stroke-width="7" marker-end="url(#cool)"/>
    <text class="t note" x="105" y="208" text-anchor="middle">왼쪽 아래로 증가</text>
  </g>
  <g transform="translate(500 82)">
    <rect class="card" width="210" height="230" rx="10"/>
    <text class="t label" x="105" y="34" text-anchor="middle">유효핵전하</text>
    <path class="grid" d="M42 70H168V175H42Z M84 70V175 M126 70V175 M42 105H168 M42 140H168"/>
    <path d="M58 122H153" stroke="#b33b32" stroke-width="7" marker-end="url(#warm)"/>
    <text class="t note" x="105" y="198" text-anchor="middle">같은 주기에서 오른쪽</text>
    <text class="t note" x="105" y="216" text-anchor="middle">새 주기에서는 재설정</text>
  </g>
  <g transform="translate(730 82)">
    <rect class="card" width="210" height="230" rx="10"/>
    <text class="t label" x="105" y="34" text-anchor="middle">첫 이온화 에너지</text>
    <path class="grid" d="M42 70H168V175H42Z M84 70V175 M126 70V175 M42 105H168 M42 140H168"/>
    <path d="M60 158L150 86" stroke="#b33b32" stroke-width="7" marker-end="url(#warm)"/>
    <text class="t note" x="105" y="208" text-anchor="middle">오른쪽 위로 증가</text>
  </g>
  <g transform="translate(960 82)">
    <rect class="card" width="210" height="230" rx="10"/>
    <text class="t label" x="105" y="34" text-anchor="middle">전기음성도</text>
    <path class="grid" d="M42 70H168V175H42Z M84 70V175 M126 70V175 M42 105H168 M42 140H168"/>
    <path d="M60 158L150 86" stroke="#b33b32" stroke-width="7" marker-end="url(#warm)"/>
    <text class="t note" x="105" y="208" text-anchor="middle">오른쪽 위로 증가</text>
  </g>

  <rect x="40" y="342" width="1120" height="122" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="t" x="65" y="375" font-size="17" font-weight="700" fill="#172033">인과관계</text>
  <text class="t" x="65" y="405" font-size="16" fill="#334155">한 주기: 핵전하 증가 → 같은 껍질 전자의 가리움으로 완전히 상쇄되지 않음 → 유효핵전하 증가 → 반지름 감소, 전자 제거 어려움</text>
  <text class="t" x="65" y="435" font-size="16" fill="#334155">한 족 아래: 주양자수와 껍질 수 증가 → 거리·가리움 증가 → 반지름 증가, 최외각전자 제거가 대체로 쉬워짐</text>

  <rect x="40" y="488" width="1120" height="116" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text class="t" x="65" y="522" font-size="17" font-weight="700" fill="#9a3412">화살표만으로 판단하면 안 되는 성질</text>
  <text class="t" x="65" y="551" font-size="15" fill="#7c2d12">전자친화도는 부껍질 안정성·전자쌍 반발의 예외가 많고, 유효핵전하는 족 방향을 단순한 대각선 화살표로 일반화하기 어렵다.</text>
  <text class="t" x="65" y="579" font-size="15" fill="#7c2d12">전이원소와 무거운 원소에서는 d·f 전자의 불완전한 가리움, 수축 효과, 상대론 효과도 함께 고려한다.</text>
</svg>
