<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Heating curve at constant pressure</title><desc id="desc">Temperature versus heat added showing solid warming, melting plateau, liquid warming, boiling plateau, and gas warming.</desc>
  <defs><style>.bg{fill:#07182d}.axis{stroke:#e8f4ff;stroke-width:4}.curve{fill:none;stroke:#65d6ff;stroke-width:9;stroke-linejoin:round}.dash{stroke:#7898b5;stroke-width:2;stroke-dasharray:8 8}.h{fill:#fff;font:700 31px Arial}.txt{fill:#dceeff;font:21px Arial}.phase{fill:#ffbd59;font:700 21px Arial}.note{fill:#bad0e5;font:17px Arial}</style></defs>
  <rect class="bg" width="1200" height="760" rx="24"/><text class="h" x="55" y="60">HEATING CURVE AT CONSTANT PRESSURE</text>
  <line class="axis" x1="125" y1="650" x2="1090" y2="650"/><line class="axis" x1="125" y1="650" x2="125" y2="105"/>
  <text class="txt" x="905" y="710">heat added, q</text><text class="txt" transform="translate(55 445) rotate(-90)">temperature</text>
  <polyline class="curve" points="165,590 335,470 515,470 680,315 875,315 1040,155"/>
  <line class="dash" x1="125" y1="470" x2="1045" y2="470"/><line class="dash" x1="125" y1="315" x2="1045" y2="315"/>
  <text class="phase" x="190" y="565">solid warms</text><text class="phase" x="365" y="450">melting</text><text class="phase" x="550" y="410">liquid warms</text><text class="phase" x="730" y="295">boiling</text><text class="phase" x="905" y="220">gas warms</text>
  <text class="txt" x="150" y="462">T<tspan baseline-shift="sub">m</tspan></text><text class="txt" x="150" y="307">T<tspan baseline-shift="sub">b</tspan></text>
  <text class="note" x="300" y="520">q = nΔH<tspan baseline-shift="sub">fus</tspan>; temperature stays constant while phases coexist</text>
  <text class="note" x="650" y="365">q = nΔH<tspan baseline-shift="sub">vap</tspan></text>
  <text class="note" x="170" y="690">Sloped regions: q = mcΔT. Plateaus: added energy changes phase, not temperature.</text>
</svg>
