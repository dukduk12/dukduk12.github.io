<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">수소 1s, 2s, 2p 오비탈의 방사 확률분포</title>
  <desc id="desc">1s는 핵 가까이에 하나의 봉우리가 있고, 2s는 방사 마디를 사이에 둔 두 봉우리, 2p는 핵에서 0으로 시작해 바깥쪽에 하나의 봉우리를 갖는다.</desc>
  <rect width="1000" height="480" fill="#fff"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172033">수소형 오비탈의 방사 확률분포 P(r)</text>
  <g stroke="#cbd5e1" stroke-width="1"><path d="M90 90H930M90 160H930M90 230H930M90 300H930M90 370H930"/><path d="M230 75V390M370 75V390M510 75V390M650 75V390M790 75V390"/></g>
  <g stroke="#334155" stroke-width="2"><path d="M90 390H945"/><path d="M90 405V70"/></g>
  <g font-family="sans-serif" fill="#334155"><text x="500" y="450" text-anchor="middle" font-size="17">핵에서의 거리 r</text><text x="25" y="235" text-anchor="middle" font-size="17" transform="rotate(-90 25 235)">방사 확률 P(r)</text><text x="82" y="412" font-size="14">0</text></g>
  <path d="M90 390 C115 250,145 110,190 95 C245 85,300 190,370 285 C450 360,600 386,930 390" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M90 390 C130 340,165 300,210 315 C245 327,260 375,285 390 C315 405,340 330,390 245 C465 120,560 95,650 160 C735 220,805 330,930 385" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M90 390 C180 388,225 355,285 300 C365 225,450 140,545 135 C650 130,735 225,790 305 C845 365,890 385,930 389" fill="none" stroke="#16a34a" stroke-width="5"/>
  <line x1="285" y1="390" x2="285" y2="315" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="285" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b91c1c">2s 방사 마디</text>
  <g font-family="sans-serif" font-size="17" font-weight="700"><text x="230" y="100" fill="#2563eb">1s</text><text x="630" y="145" fill="#dc2626">2s</text><text x="555" y="125" fill="#15803d">2p</text></g>
  <text x="925" y="72" text-anchor="end" font-family="sans-serif" font-size="13" fill="#64748b">정성적 비교 도식 · 곡선별 세로축은 정규화됨</text>
</svg>
