<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Four common types of atomic-orbital overlap</title>
  <desc id="desc">The diagram compares head-on s-s, s-p, and p-p overlap that produces sigma symmetry with side-on p-p overlap that produces pi symmetry.</desc>
  <defs><style>.plus{fill:#2563eb;opacity:.76}.minus{fill:#f97316;opacity:.76}.over{fill:#7c3aed;opacity:.62}.n{fill:#111827}.axis{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.t{font:700 20px system-ui,sans-serif;fill:#0f172a}.s{font:15px system-ui,sans-serif;fill:#334155}.tag{font:700 17px system-ui,sans-serif;fill:#1e3a8a}</style></defs>
  <rect width="1100" height="680" fill="#fff" rx="18"/>
  <text class="t" x="40" y="42">Atomic-orbital overlap: orientation determines σ or π symmetry</text>
  <rect class="panel" x="30" y="70" width="500" height="265" rx="14"/><rect class="panel" x="570" y="70" width="500" height="265" rx="14"/>
  <rect class="panel" x="30" y="370" width="500" height="265" rx="14"/><rect class="panel" x="570" y="370" width="500" height="265" rx="14"/>
  <!-- ss -->
  <text class="tag" x="55" y="105">s + s → σ(s–s)</text><line class="axis" x1="70" y1="215" x2="490" y2="215"/>
  <circle class="plus" cx="205" cy="215" r="78"/><circle class="plus" cx="345" cy="215" r="78"/><ellipse class="over" cx="275" cy="215" rx="48" ry="72"/><circle class="n" cx="205" cy="215" r="7"/><circle class="n" cx="345" cy="215" r="7"/>
  <text class="s" x="120" y="310">head-on overlap along the internuclear axis</text>
  <!-- sp -->
  <text class="tag" x="595" y="105">s + p → σ(s–p)</text><line class="axis" x1="610" y1="215" x2="1030" y2="215"/>
  <circle class="plus" cx="735" cy="215" r="68"/><ellipse class="plus" cx="890" cy="215" rx="92" ry="62"/><ellipse class="minus" cx="1010" cy="215" rx="42" ry="32"/><ellipse class="over" cx="805" cy="215" rx="34" ry="55"/><circle class="n" cx="735" cy="215" r="7"/><circle class="n" cx="950" cy="215" r="7"/>
  <text class="s" x="670" y="310">the p lobe pointing at s must have matching phase</text>
  <!-- pp sigma -->
  <text class="tag" x="55" y="405">p + p (end-on) → σ(p–p)</text><line class="axis" x1="70" y1="515" x2="490" y2="515"/>
  <ellipse class="minus" cx="120" cy="515" rx="48" ry="34"/><ellipse class="plus" cx="230" cy="515" rx="82" ry="55"/><ellipse class="plus" cx="340" cy="515" rx="82" ry="55"/><ellipse class="minus" cx="450" cy="515" rx="48" ry="34"/><ellipse class="over" cx="285" cy="515" rx="40" ry="48"/><circle class="n" cx="175" cy="515" r="7"/><circle class="n" cx="395" cy="515" r="7"/>
  <text class="s" x="120" y="610">electron density lies on the internuclear axis</text>
  <!-- pp pi -->
  <text class="tag" x="595" y="405">p + p (side-on) → π(p–p)</text><line class="axis" x1="610" y1="515" x2="1030" y2="515"/>
  <ellipse class="plus" cx="760" cy="455" rx="45" ry="72"/><ellipse class="plus" cx="900" cy="455" rx="45" ry="72"/><ellipse class="minus" cx="760" cy="575" rx="45" ry="72"/><ellipse class="minus" cx="900" cy="575" rx="45" ry="72"/>
  <ellipse class="over" cx="830" cy="455" rx="55" ry="50"/><ellipse class="over" cx="830" cy="575" rx="55" ry="50"/><circle class="n" cx="760" cy="515" r="7"/><circle class="n" cx="900" cy="515" r="7"/>
  <text class="s" x="670" y="655">density lies above and below the axis; the axis is in a nodal plane</text>
</svg>
