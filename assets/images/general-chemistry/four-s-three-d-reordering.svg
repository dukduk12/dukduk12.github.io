<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">4s와 3d 오비탈의 상대 에너지 재정렬</title><desc id="desc">칼륨과 칼슘에서는 4s가 먼저 점유되지만 3d 전자가 증가하면 3d가 4s보다 안정화되고 전이금속 양이온에서는 4s 전자를 먼저 제거한다.</desc>
  <defs><marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#c2413b"/></marker></defs>
  <rect width="1200" height="560" fill="#fff"/><text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">4s–3d 상대 에너지: 채움과 이온화에서의 재정렬</text>
  <g font-family="sans-serif"><rect x="55" y="75" width="330" height="410" rx="10" fill="#f8fafc" stroke="#94a3b8"/><rect x="435" y="75" width="330" height="410" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><rect x="815" y="75" width="330" height="410" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <g text-anchor="middle" fill="#172033"><text x="220" y="110" font-size="20" font-weight="700">K·Ca: 채우기 시작</text><text x="600" y="110" font-size="20" font-weight="700">Sc 이후: 3d 점유 증가</text><text x="980" y="110" font-size="20" font-weight="700">전이금속 양이온</text></g>
  <g stroke-width="6"><line x1="105" y1="250" x2="335" y2="250" stroke="#2563a8"/><line x1="105" y1="185" x2="335" y2="185" stroke="#c2413b"/><line x1="485" y1="190" x2="715" y2="190" stroke="#2563a8"/><line x1="485" y1="245" x2="715" y2="245" stroke="#c2413b"/><line x1="865" y1="180" x2="1095" y2="180" stroke="#2563a8"/><line x1="865" y1="265" x2="1095" y2="265" stroke="#c2413b"/></g>
  <g text-anchor="middle" font-size="18" font-weight="700"><text x="220" y="240" fill="#1d4ed8">4s: 먼저 점유</text><text x="220" y="175" fill="#a8322d">3d: 비어 있음</text><text x="600" y="180" fill="#1d4ed8">3d: 수축·안정화</text><text x="600" y="270" fill="#a8322d">4s: 상대적으로 높아짐</text><text x="980" y="170" fill="#1d4ed8">4s: 먼저 제거</text><text x="980" y="290" fill="#a8322d">3d: 남음</text></g>
  <g fill="#334155" font-size="15"><text x="85" y="330">K  [Ar]4s¹</text><text x="85" y="360">Ca [Ar]4s²</text><text x="465" y="330">Sc [Ar]3d¹4s²</text><text x="465" y="360">Fe [Ar]3d⁶4s²</text><text x="845" y="330">Fe²⁺ [Ar]3d⁶</text><text x="845" y="360">Fe³⁺ [Ar]3d⁵</text></g>
  <path d="M365 280H420" stroke="#c2413b" stroke-width="4" marker-end="url(#arrowR)"/><path d="M745 280H800" stroke="#c2413b" stroke-width="4" marker-end="url(#arrowR)"/>
  <g fill="#475569" font-size="14"><text x="80" y="435">4s와 3d의 차이는 작고</text><text x="80" y="458">전자배치에 따라 달라진다.</text><text x="460" y="420">핵전하 증가와 3d 전자 점유로</text><text x="460" y="443">3d가 더 안쪽으로 수축한다.</text><text x="840" y="420">‘마지막에 쓴 전자부터 제거’가 아니라</text><text x="840" y="443">현재 에너지가 높은 4s부터 제거한다.</text></g></g>
  <text x="600" y="530" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">강조된 가운데 패널이 상대 에너지 순서가 재정렬되는 구간이다.</text>
</svg>
