<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">수소 원자의 에너지 준위와 Lyman, Balmer, Paschen 계열</title>
  <desc id="desc">수소 에너지 준위 En=-13.6 eV/n2와 n=1,2,3으로 끝나는 Lyman, Balmer, Paschen 방출 전이.</desc>
  <defs><marker id="a1" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7c3aed"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563eb"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#dc2626"/></marker></defs>
  <rect width="1200" height="700" fill="#fff"/><text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">수소 원자의 에너지 준위와 선 계열</text>
  <g font-family="sans-serif" font-size="15" fill="#334155"><text x="55" y="75">에너지 / eV</text><text x="920" y="74" font-size="18">Eₙ = −K/n²,  K = 13.6 eV = 2.18×10⁻¹⁸ J</text></g>
  <g stroke="#475569" stroke-width="2"><line x1="150" y1="620" x2="1080" y2="620"/><line x1="150" y1="245" x2="1080" y2="245"/><line x1="150" y1="175" x2="1080" y2="175"/><line x1="150" y1="150" x2="1080" y2="150"/><line x1="150" y1="138" x2="1080" y2="138"/><line x1="150" y1="118" x2="1080" y2="118" stroke-dasharray="6 5"/></g>
  <g font-family="sans-serif" font-size="16" fill="#172033"><text x="65" y="625">n=1  −13.60</text><text x="65" y="250">n=2  −3.40</text><text x="65" y="180">n=3  −1.51</text><text x="65" y="155">n=4  −0.85</text><text x="65" y="143">n=5  −0.54</text><text x="65" y="123">n=∞  0</text></g>
  <g fill="none" stroke-width="4"><path d="M300 138V610" stroke="#7c3aed" marker-end="url(#a1)"/><path d="M350 150V610" stroke="#7c3aed" marker-end="url(#a1)"/><path d="M400 175V610" stroke="#7c3aed" marker-end="url(#a1)"/><path d="M570 138V235" stroke="#2563eb" marker-end="url(#a2)"/><path d="M620 150V235" stroke="#2563eb" marker-end="url(#a2)"/><path d="M670 175V235" stroke="#2563eb" marker-end="url(#a2)"/><path d="M840 138V165" stroke="#dc2626" marker-end="url(#a3)"/><path d="M890 150V165" stroke="#dc2626" marker-end="url(#a3)"/></g>
  <g font-family="sans-serif" text-anchor="middle"><text x="350" y="665" font-size="20" font-weight="700" fill="#6d28d9">Lyman</text><text x="350" y="686" font-size="15" fill="#334155">n→1 · 자외선</text><text x="620" y="665" font-size="20" font-weight="700" fill="#1d4ed8">Balmer</text><text x="620" y="686" font-size="15" fill="#334155">n→2 · 가시광/근자외선</text><text x="865" y="665" font-size="20" font-weight="700" fill="#b91c1c">Paschen</text><text x="865" y="686" font-size="15" fill="#334155">n→3 · 적외선</text></g>
  <text x="1080" y="105" text-anchor="end" font-family="sans-serif" font-size="14" fill="#475569">위쪽으로 갈수록 준위 간격이 좁아져 E=0에 수렴</text>
</svg>
