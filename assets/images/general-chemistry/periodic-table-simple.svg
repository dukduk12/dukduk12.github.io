<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Simplified periodic table</title>
  <desc id="desc">A simplified periodic table showing representative elements, metals, metalloids, nonmetals, and common main-group charges.</desc>
  <rect width="1200" height="600" rx="28" fill="#f7fafc"/>
  <text x="600" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17324d">Simplified periodic table · 간단한 주기율표</text>
  <g font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#243b53">
    <text x="95" y="83">1</text><text x="150" y="83">2</text><text x="645" y="83">13</text><text x="700" y="83">14</text><text x="755" y="83">15</text><text x="810" y="83">16</text><text x="865" y="83">17</text><text x="920" y="83">18</text>
    <text x="95" y="105" fill="#245a8d">+1</text><text x="150" y="105" fill="#245a8d">+2</text><text x="645" y="105">±3</text><text x="810" y="105" fill="#9c2c2c">−2</text><text x="865" y="105" fill="#9c2c2c">−1</text><text x="920" y="105">0</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <g fill="#a9d2f3" stroke="#4e86b4"><rect x="68" y="120" width="52" height="52"/><rect x="893" y="120" width="52" height="52" fill="#ffd6a5"/><rect x="68" y="180" width="52" height="52"/><rect x="123" y="180" width="52" height="52"/><rect x="618" y="180" width="52" height="52" fill="#b8e0d2"/><rect x="673" y="180" width="52" height="52" fill="#ffd6a5"/><rect x="728" y="180" width="52" height="52" fill="#ffd6a5"/><rect x="783" y="180" width="52" height="52" fill="#ffd6a5"/><rect x="838" y="180" width="52" height="52" fill="#ffd6a5"/><rect x="893" y="180" width="52" height="52" fill="#ffd6a5"/>
      <rect x="68" y="240" width="52" height="52"/><rect x="123" y="240" width="52" height="52"/><rect x="618" y="240" width="52" height="52" fill="#a9d2f3"/><rect x="673" y="240" width="52" height="52" fill="#b8e0d2"/><rect x="728" y="240" width="52" height="52" fill="#ffd6a5"/><rect x="783" y="240" width="52" height="52" fill="#ffd6a5"/><rect x="838" y="240" width="52" height="52" fill="#ffd6a5"/><rect x="893" y="240" width="52" height="52" fill="#ffd6a5"/>
      <rect x="68" y="300" width="52" height="52"/><rect x="123" y="300" width="52" height="52"/><rect x="178" y="300" width="437" height="52" fill="#c9c3ee"/><rect x="618" y="300" width="52" height="52" fill="#a9d2f3"/><rect x="673" y="300" width="52" height="52" fill="#b8e0d2"/><rect x="728" y="300" width="52" height="52" fill="#b8e0d2"/><rect x="783" y="300" width="52" height="52" fill="#ffd6a5"/><rect x="838" y="300" width="52" height="52" fill="#ffd6a5"/><rect x="893" y="300" width="52" height="52" fill="#ffd6a5"/>
      <rect x="68" y="360" width="52" height="52"/><rect x="123" y="360" width="52" height="52"/><rect x="178" y="360" width="437" height="52" fill="#c9c3ee"/><rect x="618" y="360" width="52" height="52" fill="#a9d2f3"/><rect x="673" y="360" width="52" height="52" fill="#a9d2f3"/><rect x="728" y="360" width="52" height="52" fill="#b8e0d2"/><rect x="783" y="360" width="52" height="52" fill="#b8e0d2"/><rect x="838" y="360" width="52" height="52" fill="#ffd6a5"/><rect x="893" y="360" width="52" height="52" fill="#ffd6a5"/>
      <rect x="68" y="420" width="52" height="52"/><rect x="123" y="420" width="52" height="52"/><rect x="178" y="420" width="437" height="52" fill="#c9c3ee"/><rect x="618" y="420" width="52" height="52" fill="#a9d2f3"/><rect x="673" y="420" width="52" height="52" fill="#a9d2f3"/><rect x="728" y="420" width="52" height="52" fill="#a9d2f3"/><rect x="783" y="420" width="52" height="52" fill="#b8e0d2"/><rect x="838" y="420" width="52" height="52" fill="#b8e0d2"/><rect x="893" y="420" width="52" height="52" fill="#ffd6a5"/>
    </g>
    <text x="94" y="153">H</text><text x="919" y="153">He</text><text x="94" y="213">Li</text><text x="149" y="213">Be</text><text x="644" y="213">B</text><text x="699" y="213">C</text><text x="754" y="213">N</text><text x="809" y="213">O</text><text x="864" y="213">F</text><text x="919" y="213">Ne</text>
    <text x="94" y="273">Na</text><text x="149" y="273">Mg</text><text x="644" y="273">Al</text><text x="699" y="273">Si</text><text x="754" y="273">P</text><text x="809" y="273">S</text><text x="864" y="273">Cl</text><text x="919" y="273">Ar</text>
    <text x="397" y="333">transition metals · 전이 금속</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="18"><rect x="990" y="160" width="26" height="26" fill="#a9d2f3" stroke="#4e86b4"/><text x="1028" y="180">metals · 금속</text><rect x="990" y="205" width="26" height="26" fill="#b8e0d2" stroke="#4e86b4"/><text x="1028" y="225">metalloids · 준금속</text><rect x="990" y="250" width="26" height="26" fill="#ffd6a5" stroke="#4e86b4"/><text x="1028" y="270">nonmetals · 비금속</text><rect x="990" y="295" width="26" height="26" fill="#c9c3ee" stroke="#4e86b4"/><text x="1028" y="315">transition metals</text></g>
  <text x="510" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#486581">Representative layout only; the full table contains periods 1–7 and groups 1–18.</text>
  <text x="510" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#486581">대표 배치도이며 실제 주기율표는 1–7주기와 1–18족으로 구성된다.</text>
</svg>
