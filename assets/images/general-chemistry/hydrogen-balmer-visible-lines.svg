<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">수소 Balmer 계열의 가시광 방출선</title>
  <desc id="desc">수소 방전관에서 관찰되는 410.2, 434.0, 486.1, 656.3 나노미터 방출선과 각각의 전이.</desc>
  <defs><linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#5b21b6"/><stop offset=".18" stop-color="#3730a3"/><stop offset=".34" stop-color="#0284c7"/><stop offset=".50" stop-color="#16a34a"/><stop offset=".66" stop-color="#eab308"/><stop offset=".82" stop-color="#ea580c"/><stop offset="1" stop-color="#b91c1c"/></linearGradient></defs>
  <rect width="1200" height="410" fill="#fff"/>
  <text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">수소 Balmer 계열: 가시광 방출선</text>
  <rect x="80" y="92" width="1040" height="116" rx="8" fill="#080b16"/>
  <g stroke-linecap="round"><line x1="179" y1="105" x2="179" y2="195" stroke="#7c3aed" stroke-width="7"/><line x1="255" y1="105" x2="255" y2="195" stroke="#4f46e5" stroke-width="7"/><line x1="418" y1="105" x2="418" y2="195" stroke="#22a8e6" stroke-width="8"/><line x1="918" y1="105" x2="918" y2="195" stroke="#ef3038" stroke-width="9"/></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#172033"><text x="179" y="238" font-size="17" font-weight="700">410.2 nm</text><text x="179" y="262" font-size="15">Hδ · 6→2</text><text x="255" y="238" font-size="17" font-weight="700">434.0 nm</text><text x="255" y="262" font-size="15">Hγ · 5→2</text><text x="418" y="238" font-size="17" font-weight="700">486.1 nm</text><text x="418" y="262" font-size="15">Hβ · 4→2</text><text x="918" y="238" font-size="17" font-weight="700">656.3 nm</text><text x="918" y="262" font-size="15">Hα · 3→2</text></g>
  <rect x="80" y="300" width="1040" height="30" rx="3" fill="url(#vis)"/>
  <g font-family="sans-serif" font-size="14" text-anchor="middle" fill="#334155"><text x="80" y="354">380 nm</text><text x="245" y="354">430</text><text x="410" y="354">480</text><text x="575" y="354">530</text><text x="740" y="354">580</text><text x="905" y="354">630</text><text x="1120" y="354">700 nm</text><text x="600" y="390">파장 증가 →</text></g>
</svg>
