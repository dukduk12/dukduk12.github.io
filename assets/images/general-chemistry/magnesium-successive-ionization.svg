<svg xmlns="http://www.w3.org/2000/svg" width="950" height="500" viewBox="0 0 950 500" role="img" aria-labelledby="title desc">
  <title id="title">마그네슘의 순차 이온화 에너지</title><desc id="desc">마그네슘은 두 원자가전자를 제거한 뒤 세 번째 이온화 에너지에서 큰 도약이 나타난다.</desc>
  <rect width="950" height="500" fill="#fff"/><text x="475" y="38" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172033">Mg의 순차 이온화 에너지</text>
  <g stroke="#e2e8f0"><line x1="95" y1="400" x2="890" y2="400"/><line x1="95" y1="320" x2="890" y2="320"/><line x1="95" y1="240" x2="890" y2="240"/><line x1="95" y1="160" x2="890" y2="160"/><line x1="95" y1="80" x2="890" y2="80"/></g>
  <g fill="#4f83cc"><rect x="150" y="376" width="120" height="24"/><rect x="335" y="354" width="120" height="46"/></g><g fill="#c2413b"><rect x="520" y="153" width="120" height="247"/><rect x="705" y="63" width="120" height="337"/></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#172033"><text x="210" y="430" font-size="17">IE₁</text><text x="395" y="430" font-size="17">IE₂</text><text x="580" y="430" font-size="17">IE₃</text><text x="765" y="430" font-size="17">IE₄</text><text x="210" y="365" font-size="14">0.738</text><text x="395" y="343" font-size="14">1.451</text><text x="580" y="142" font-size="14">7.733</text><text x="765" y="52" font-size="14">10.543 MJ mol⁻¹</text></g>
  <path d="M470 340L500 260" stroke="#c2413b" stroke-width="4"/><text x="470" y="250" text-anchor="end" font-family="sans-serif" font-size="16" font-weight="700" fill="#a8322d">두 전자 뒤 큰 도약</text><text x="475" y="472" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">[Ne]3s²의 3s 전자 두 개를 제거한 다음 내부껍질 전자를 제거해야 한다.</text>
</svg>
