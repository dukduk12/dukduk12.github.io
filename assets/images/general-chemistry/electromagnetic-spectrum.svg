<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">전자기파 스펙트럼과 가시광선의 파장 범위</title>
  <desc id="desc">감마선에서 라디오파로 갈수록 파장이 길어지고 진동수와 광자 에너지는 작아진다. 가시광선은 약 380에서 750 나노미터 범위다.</desc>
  <defs>
    <linearGradient id="visible" x1="0" x2="1">
      <stop offset="0" stop-color="#6f2dbd"/><stop offset=".18" stop-color="#3155c6"/><stop offset=".36" stop-color="#19a0d8"/>
      <stop offset=".52" stop-color="#2ca25f"/><stop offset=".68" stop-color="#f0d43a"/><stop offset=".84" stop-color="#ef8a23"/><stop offset="1" stop-color="#cf2f2f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="360" fill="#fff"/>
  <text x="600" y="34" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">전자기파 스펙트럼</text>
  <g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#172033">
    <rect x="55" y="80" width="150" height="54" fill="#6d28d9"/><rect x="205" y="80" width="150" height="54" fill="#7c3aed"/>
    <rect x="355" y="80" width="150" height="54" fill="#2563eb"/><rect x="505" y="80" width="150" height="54" fill="url(#visible)"/>
    <rect x="655" y="80" width="150" height="54" fill="#dc2626"/><rect x="805" y="80" width="150" height="54" fill="#ef7f1a"/>
    <rect x="955" y="80" width="190" height="54" fill="#d6a31d"/>
    <g fill="#fff"><text x="130" y="113">감마선</text><text x="280" y="113">X선</text><text x="430" y="113">자외선</text><text x="580" y="113">가시광선</text><text x="730" y="113">적외선</text><text x="880" y="113">마이크로파</text><text x="1050" y="113">라디오파</text></g>
  </g>
  <line x1="70" y1="165" x2="1130" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">파장 λ 증가 · 진동수 ν 감소 · 광자 에너지 E 감소</text>
  <text x="55" y="220" font-family="sans-serif" font-size="14" fill="#475569">대략적 파장 경계</text>
  <g font-family="monospace" font-size="14" text-anchor="middle" fill="#334155">
    <text x="205" y="220">10 pm</text><text x="355" y="220">10 nm</text><text x="505" y="220">380 nm</text><text x="655" y="220">750 nm</text><text x="805" y="220">1 mm</text><text x="955" y="220">1 m</text>
  </g>
  <rect x="190" y="255" width="820" height="34" rx="4" fill="url(#visible)"/>
  <g font-family="sans-serif" font-size="14" text-anchor="middle" fill="#172033">
    <text x="190" y="312">380 nm</text><text x="330" y="312">450</text><text x="470" y="312">500</text><text x="610" y="312">570</text><text x="750" y="312">590</text><text x="890" y="312">620</text><text x="1010" y="312">750 nm</text>
    <text x="250" y="342">보라</text><text x="375" y="342">파랑</text><text x="500" y="342">초록</text><text x="625" y="342">노랑</text><text x="750" y="342">주황</text><text x="920" y="342">빨강</text>
  </g>
</svg>
