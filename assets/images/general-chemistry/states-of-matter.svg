<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">Particle models of the three states of matter</title>
  <desc id="desc">Solid particles are ordered and close, liquid particles are close and disordered, and gas particles are far apart.</desc>
  <rect width="1080" height="430" rx="28" fill="#f7fafc"/>
  <text x="540" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#17324d">Three states of matter · 물질의 세 가지 상태</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(40 80)">
      <rect width="300" height="270" rx="18" fill="#e6f0ff" stroke="#6a96c8" stroke-width="3"/>
      <text x="150" y="36" font-size="25" font-weight="700" fill="#204f7d">Solid · 고체</text>
      <g fill="#3178b8">
        <circle cx="90" cy="95" r="18"/><circle cx="150" cy="95" r="18"/><circle cx="210" cy="95" r="18"/>
        <circle cx="90" cy="150" r="18"/><circle cx="150" cy="150" r="18"/><circle cx="210" cy="150" r="18"/>
        <circle cx="90" cy="205" r="18"/><circle cx="150" cy="205" r="18"/><circle cx="210" cy="205" r="18"/>
      </g>
      <text x="150" y="252" font-size="18" fill="#334e68">close + ordered · 가깝고 질서 있음</text>
    </g>
    <g transform="translate(390 80)">
      <rect width="300" height="270" rx="18" fill="#e8f7f1" stroke="#55a383" stroke-width="3"/>
      <text x="150" y="36" font-size="25" font-weight="700" fill="#276749">Liquid · 액체</text>
      <g fill="#2f9e72">
        <circle cx="78" cy="180" r="18"/><circle cx="125" cy="151" r="18"/><circle cx="174" cy="183" r="18"/>
        <circle cx="223" cy="148" r="18"/><circle cx="98" cy="220" r="18"/><circle cx="151" cy="225" r="18"/>
        <circle cx="208" cy="213" r="18"/><circle cx="250" cy="194" r="18"/>
      </g>
      <path d="M42 128v112h216V128" fill="none" stroke="#55a383" stroke-width="3"/>
      <text x="150" y="252" font-size="18" fill="#334e68">close + mobile · 가깝고 이동함</text>
    </g>
    <g transform="translate(740 80)">
      <rect width="300" height="270" rx="18" fill="#fff3df" stroke="#d49a44" stroke-width="3"/>
      <text x="150" y="36" font-size="25" font-weight="700" fill="#975a16">Gas · 기체</text>
      <g fill="#dd8b22">
        <circle cx="65" cy="90" r="15"/><circle cx="232" cy="82" r="15"/><circle cx="155" cy="145" r="15"/>
        <circle cx="72" cy="220" r="15"/><circle cx="250" cy="212" r="15"/>
      </g>
      <g stroke="#b96a10" stroke-width="3"><path d="M82 90h32"/><path d="M216 82h-32"/><path d="M155 162v27"/><path d="M89 212l28-20"/><path d="M233 204l-27-20"/></g>
      <text x="150" y="252" font-size="18" fill="#334e68">far apart · 멀리 떨어짐</text>
    </g>
  </g>
  <text x="540" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#486581">Attractions hold condensed phases close; thermal motion spreads gas particles apart.</text>
</svg>
