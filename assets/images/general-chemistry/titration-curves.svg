<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Acid-base titration curves</title><desc id="desc">Comparison of a strong acid titrated by strong base and a weak acid titrated by strong base, marking half-equivalence and equivalence points.</desc>
  <defs><style>.bg{fill:#07182d}.axis{stroke:#e8f4ff;stroke-width:4}.grid{stroke:#37536e;stroke-width:1.5}.strong{fill:none;stroke:#ff6f61;stroke-width:8}.weak{fill:none;stroke:#65d6ff;stroke-width:8}.dash{stroke:#ffbd59;stroke-width:3;stroke-dasharray:9 8}.h{fill:#fff;font:700 31px Arial}.txt{fill:#dceeff;font:20px Arial}.small{fill:#bad0e5;font:17px Arial}</style></defs>
  <rect class="bg" width="1200" height="780" rx="24"/><text class="h" x="55" y="60">ACID–BASE TITRATION CURVES</text>
  <line class="axis" x1="125" y1="675" x2="1090" y2="675"/><line class="axis" x1="125" y1="675" x2="125" y2="105"/>
  <g class="grid"><line x1="125" y1="635" x2="1090" y2="635"/><line x1="125" y1="395" x2="1090" y2="395"/><line x1="125" y1="155" x2="1090" y2="155"/></g>
  <text class="txt" x="1050" y="725">V<tspan baseline-shift="sub">base</tspan></text><text class="txt" transform="translate(55 430) rotate(-90)">pH</text>
  <text class="small" x="90" y="642">1</text><text class="small" x="90" y="402">7</text><text class="small" x="82" y="162">13</text>
  <path class="strong" d="M155 620C370 615 520 595 585 525C615 490 630 435 638 395C646 345 660 275 695 235C760 170 900 160 1040 155"/>
  <path class="weak" d="M155 540C290 515 415 470 520 435C575 415 615 405 635 365C650 325 650 270 675 225C740 170 900 158 1040 155"/>
  <line class="dash" x1="400" y1="675" x2="400" y2="435"/><text class="small" x="305" y="420">half-equivalence: pH = pK<tspan baseline-shift="sub">a</tspan></text>
  <line class="dash" x1="640" y1="675" x2="640" y2="115"/><text class="small" x="655" y="335">weak-acid equivalence: pH &gt; 7</text><text class="small" x="655" y="395">strong/strong equivalence: pH ≈ 7 at 25 °C</text>
  <line x1="785" y1="600" x2="835" y2="600" class="strong"/><text class="small" x="850" y="607">strong acid + strong base</text>
  <line x1="785" y1="640" x2="835" y2="640" class="weak"/><text class="small" x="850" y="647">weak acid + strong base</text>
</svg>
