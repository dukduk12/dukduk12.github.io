<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reaction-coordinate diagram with and without a catalyst</title>
  <desc id="desc">Potential energy versus reaction progress showing identical reactant and product energies but a lower activation barrier for the catalyzed pathway.</desc>
  <defs>
    <style>.bg{fill:#07182d}.axis{stroke:#e8f4ff;stroke-width:4}.tick{stroke:#7898b5;stroke-width:2;stroke-dasharray:8 8}.uncat{fill:none;stroke:#ff6f61;stroke-width:8}.cat{fill:none;stroke:#65d6ff;stroke-width:8}.energy{stroke:#ffbd59;stroke-width:4;marker-start:url(#a);marker-end:url(#a)}.h{fill:#fff;font:700 31px Arial}.txt{fill:#dceeff;font:21px Arial}.small{fill:#bad0e5;font:18px Arial}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 5L10 0L10 10z" fill="#ffbd59"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760" rx="24"/><text class="h" x="55" y="60">REACTION COORDINATE · CATALYST LOWERS THE BARRIER</text>
  <line class="axis" x1="125" y1="650" x2="1090" y2="650"/><line class="axis" x1="125" y1="650" x2="125" y2="110"/>
  <text class="txt" x="850" y="710">reaction progress</text><text class="txt" transform="translate(55 455) rotate(-90)">potential energy</text>
  <line class="tick" x1="155" y1="510" x2="1040" y2="510"/><line class="tick" x1="155" y1="575" x2="1040" y2="575"/>
  <path class="uncat" d="M155 510C285 510 355 445 455 205C525 75 625 135 700 345C760 510 875 575 1040 575"/>
  <path class="cat" d="M155 510C285 510 350 450 445 350C535 255 620 295 705 420C785 540 875 575 1040 575"/>
  <line class="energy" x1="300" y1="500" x2="300" y2="210"/><text class="txt" x="315" y="330">E<tspan baseline-shift="sub">a</tspan> uncatalyzed</text>
  <line class="energy" x1="775" y1="500" x2="775" y2="355"/><text class="txt" x="790" y="420">E<tspan baseline-shift="sub">a</tspan> catalyzed</text>
  <line class="energy" x1="990" y1="510" x2="990" y2="575"/><text class="txt" x="865" y="555">ΔH<tspan baseline-shift="baseline"> &lt; 0</tspan></text>
  <text class="txt" x="165" y="495">reactants</text><text class="txt" x="920" y="615">products</text>
  <line x1="820" y1="145" x2="870" y2="145" class="uncat"/><text class="small" x="890" y="152">uncatalyzed path</text>
  <line x1="820" y1="185" x2="870" y2="185" class="cat"/><text class="small" x="890" y="192">catalyzed path</text>
  <text class="small" x="155" y="690">A catalyst changes the pathway and activation energy, not ΔH, ΔG°, or K.</text>
</svg>
