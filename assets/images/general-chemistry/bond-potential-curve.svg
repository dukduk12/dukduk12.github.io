<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Internuclear distance and potential energy during bond formation and dissociation</title>
  <desc id="desc">The curve falls as separated atoms approach through the attractive region, reaches a minimum at the equilibrium bond length, and rises steeply where repulsion dominates. Bond formation releases the bond energy, while dissociation absorbs it.</desc>
  <defs><style>.axis{stroke:#334155;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:5 5}.curve{fill:none;stroke:#2563eb;stroke-width:6}.mark{stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 5}.arrow{stroke-width:4;fill:none;marker-end:url(#a)}.t{font:18px system-ui,sans-serif;fill:#0f172a}.s{font:15px system-ui,sans-serif;fill:#334155}.b{font-weight:700}.box{fill:#f8fafc;stroke:#cbd5e1}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="context-stroke"/></marker></defs>
  <rect width="1040" height="620" fill="#fff" rx="18"/>
  <text class="t b" x="55" y="38">Potential energy profile of a covalent bond</text>
  <line class="axis" x1="90" y1="70" x2="90" y2="525"/><line class="axis" x1="90" y1="525" x2="985" y2="525"/><line class="grid" x1="90" y1="225" x2="985" y2="225"/>
  <path class="curve" d="M115 82 C165 92 205 150 270 355 C305 468 350 475 405 432 C540 330 700 255 960 230"/>
  <line class="mark" x1="350" y1="225" x2="350" y2="455"/><line class="mark" x1="90" y1="455" x2="350" y2="455"/>
  <circle cx="350" cy="455" r="8" fill="#7c3aed"/>
  <text class="t b" x="326" y="420">A—B</text><text class="s" x="320" y="398">bonded</text>
  <text class="t b" x="880" y="260">A ··· B</text><text class="s" x="842" y="283">separated atoms</text>
  <text class="t" x="445" y="585">Internuclear distance, r</text><text class="t" transform="rotate(-90 28 355)" x="28" y="355">Potential energy, U(r)</text>
  <text class="s b" x="320" y="500">rₑ: equilibrium bond length</text><text class="s b" x="105" y="448">−BE</text><text class="s" x="788" y="214">U → 0: no interaction</text>
  <rect class="box" x="115" y="265" width="190" height="78" rx="10"/><text class="s b" x="132" y="291">r &lt; rₑ</text><text class="s" x="132" y="315">repulsion dominates</text><text class="s" x="132" y="337">compression needs energy</text>
  <rect class="box" x="575" y="300" width="205" height="74" rx="10"/><text class="s b" x="592" y="326">r &gt; rₑ</text><text class="s" x="592" y="350">attraction dominates</text>
  <path class="arrow" d="M865 292 C720 350 555 413 390 442" stroke="#16a34a"/><text class="s b" x="570" y="408" fill="#166534">right → left: bond forms, BE released</text>
  <path class="arrow" d="M390 474 C560 505 755 455 900 315" stroke="#dc2626"/><text class="s b" x="590" y="505" fill="#991b1b">left → right: bond breaks, BE absorbed</text>
</svg>
