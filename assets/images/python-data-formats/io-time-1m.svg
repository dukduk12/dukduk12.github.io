<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d">
<title id="t">Write and full-read times for one million rows</title><desc id="d">Grouped bars compare median write and read seconds.</desc>
<rect width="1100" height="650" fill="#fff"/><text x="550" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">1,000,000 rows · median elapsed time (seconds)</text>
<g font-family="sans-serif" font-size="15" fill="#334155">
<rect x="800" y="55" width="18" height="18" fill="#2563a8"/><text x="825" y="70">write</text><rect x="900" y="55" width="18" height="18" fill="#e07a2d"/><text x="925" y="70">full read</text>
<text x="190" y="112" text-anchor="end">Feather Zstd</text><rect x="210" y="92" width="18" height="15" fill="#2563a8"/><rect x="210" y="110" width="23" height="15" fill="#e07a2d"/><text x="245" y="119">0.26 / 0.33</text>
<text x="190" y="162" text-anchor="end">Parquet Snappy</text><rect x="210" y="142" width="28" height="15" fill="#2563a8"/><rect x="210" y="160" width="24" height="15" fill="#e07a2d"/><text x="250" y="169">0.40 / 0.35</text>
<text x="190" y="212" text-anchor="end">Parquet Zstd</text><rect x="210" y="192" width="48" height="15" fill="#2563a8"/><rect x="210" y="210" width="28" height="15" fill="#e07a2d"/><text x="270" y="219">0.68 / 0.40</text>
<text x="190" y="262" text-anchor="end">ORC Zlib</text><rect x="210" y="242" width="79" height="15" fill="#2563a8"/><rect x="210" y="260" width="35" height="15" fill="#e07a2d"/><text x="302" y="269">1.13 / 0.50</text>
<text x="190" y="312" text-anchor="end">CSV</text><rect x="210" y="292" width="291" height="15" fill="#2563a8"/><rect x="210" y="310" width="122" height="15" fill="#e07a2d"/><text x="514" y="319">4.16 / 1.74</text>
<text x="190" y="362" text-anchor="end">Avro Deflate</text><rect x="210" y="342" width="366" height="15" fill="#2563a8"/><rect x="210" y="360" width="386" height="15" fill="#e07a2d"/><text x="610" y="369">5.24 / 5.51</text>
<text x="190" y="412" text-anchor="end">JSONL</text><rect x="210" y="392" width="170" height="15" fill="#2563a8"/><rect x="210" y="410" width="281" height="15" fill="#e07a2d"/><text x="505" y="419">2.43 / 4.01</text>
<text x="190" y="462" text-anchor="end">CSV gzip</text><rect x="210" y="442" width="865" height="15" fill="#2563a8"/><rect x="210" y="460" width="119" height="15" fill="#e07a2d"/><text x="980" y="489">12.36 / 1.70</text>
<text x="190" y="512" text-anchor="end">JSONL gzip</text><rect x="210" y="492" width="916" height="15" fill="#2563a8"/><rect x="210" y="510" width="339" height="15" fill="#e07a2d"/><text x="900" y="539">13.10 / 4.84</text>
<text x="190" y="562" text-anchor="end">Pickle gzip</text><rect x="210" y="542" width="820" height="15" fill="#2563a8"/><text x="1040" y="554">32.28*</text><rect x="210" y="560" width="30" height="15" fill="#e07a2d"/><text x="250" y="572">0.44</text>
</g><text x="550" y="625" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">* Pickle write bar is clipped; gzip serialization took 32.28 s.</text></svg>
