<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Weight W and error E loss landscape</title>
  <desc id="desc">A one-dimensional loss curve showing gradient direction, step size, a local minimum, and a global minimum.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d14"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="900" height="480" rx="18" fill="#fbfbfd"/>
  <g stroke="#a8adb7" stroke-width="2">
    <path d="M80 405H850"/><path d="M80 405V45"/>
  </g>
  <text x="835" y="438" font-family="sans-serif" font-size="22" fill="#222">Weight W</text>
  <text x="24" y="55" font-family="sans-serif" font-size="22" fill="#222">Error E(W)</text>
  <path d="M105 100 C165 105 170 325 280 330 C365 335 370 180 455 185 C545 190 535 365 675 372 C750 375 790 310 835 215" fill="none" stroke="#252a34" stroke-width="5"/>
  <g font-family="sans-serif" font-size="18" fill="#222">
    <circle cx="280" cy="330" r="7" fill="#f59e0b"/><text x="215" y="365">local minimum</text>
    <circle cx="675" cy="372" r="7" fill="#16a34a"/><text x="620" y="407">global minimum</text>
  </g>
  <circle cx="420" cy="202" r="8" fill="#2563eb"/>
  <text x="430" y="178" font-family="Arial, sans-serif" font-size="18" fill="#2563eb">current W</text>
  <path d="M412 216 L365 258" stroke="#d14" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="260" y="247" width="96" height="30" rx="6" fill="#fbfbfd" opacity=".94"/>
  <text x="308" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#d14">direction</text>
  <path d="M420 300 L340 300" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <rect x="347" y="308" width="152" height="30" rx="6" fill="#fbfbfd" opacity=".94"/>
  <text x="423" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#2563eb">step size</text>
  <text x="520" y="75" font-family="Arial, sans-serif" font-size="17" fill="#555">gradient sets direction; learning rate sets scale</text>
</svg>
