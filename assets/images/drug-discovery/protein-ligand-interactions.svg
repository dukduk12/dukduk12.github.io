<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Protein–ligand binding-pocket interaction diagram</title>
  <desc id="desc">A conceptual ligand in a protein pocket showing hydrogen bonding, an ionic interaction, hydrophobic contact, and pi stacking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5f1"/>
    </linearGradient>
    <style>
      .label{font:600 24px system-ui,sans-serif;fill:#23313d}
      .small{font:18px system-ui,sans-serif;fill:#40505e}
      .res{font:600 19px ui-monospace,monospace;fill:#23313d}
      .bond{stroke:#295f8e;stroke-width:8;stroke-linecap:round}
      .dash{fill:none;stroke-width:4;stroke-dasharray:10 9}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <path d="M135 150 C250 55 420 95 505 185 C580 265 650 268 723 178 C805 78 1010 76 1090 185 L1090 566 C965 638 807 618 722 526 C651 449 566 445 492 530 C400 636 230 628 135 545 Z"
        fill="#dbe9e2" stroke="#8bb29e" stroke-width="5"/>
  <path d="M345 223 C420 178 482 223 520 290 C553 349 621 365 672 323 C729 276 794 188 875 220 C939 246 953 337 914 397 C872 462 786 466 722 430 C650 389 575 395 516 452 C457 510 361 475 326 406 C294 343 286 258 345 223 Z"
        fill="#ffffff" stroke="#aac6b8" stroke-width="4"/>

  <text x="64" y="64" class="label">Protein binding pocket</text>

  <!-- ligand scaffold -->
  <polygon points="490,332 535,306 580,332 580,384 535,410 490,384" fill="#ffe7a3" stroke="#7a5b00" stroke-width="6"/>
  <polygon points="580,332 625,306 670,332 670,384 625,410 580,384" fill="#ffe7a3" stroke="#7a5b00" stroke-width="6"/>
  <line x1="670" y1="358" x2="735" y2="358" class="bond"/>
  <circle cx="754" cy="358" r="20" fill="#d7ecff" stroke="#246da8" stroke-width="5"/>
  <text x="746" y="366" class="res">N</text>
  <line x1="490" y1="358" x2="430" y2="358" class="bond"/>
  <circle cx="410" cy="358" r="21" fill="#ffdada" stroke="#b13c3c" stroke-width="5"/>
  <text x="401" y="366" class="res">O</text>
  <text x="520" y="455" class="label">ligand</text>

  <!-- hydrogen bond -->
  <circle cx="286" cy="305" r="30" fill="#ffdada" stroke="#b13c3c" stroke-width="4"/>
  <text x="270" y="313" class="res">OH</text>
  <text x="215" y="252" class="res">Ser</text>
  <line x1="315" y1="316" x2="390" y2="348" class="dash" stroke="#2f80c0"/>
  <text x="160" y="382" class="small">hydrogen bond</text>

  <!-- salt bridge -->
  <circle cx="846" cy="337" r="34" fill="#e8dcff" stroke="#724caf" stroke-width="4"/>
  <text x="827" y="346" class="res">–COO⁻</text>
  <text x="831" y="281" class="res">Asp</text>
  <line x1="777" y1="357" x2="812" y2="345" class="dash" stroke="#8a56c2"/>
  <text x="904" y="348" class="small">ionic interaction</text>

  <!-- hydrophobic -->
  <circle cx="440" cy="527" r="48" fill="#f1e2bd" stroke="#a27920" stroke-width="4"/>
  <text x="417" y="535" class="res">Leu</text>
  <path d="M470 493 Q505 464 535 422" class="dash" stroke="#a27920"/>
  <text x="240" y="600" class="small">hydrophobic contact</text>

  <!-- pi stacking -->
  <polygon points="625,168 666,145 707,168 707,215 666,238 625,215" fill="#d7ecff" stroke="#246da8" stroke-width="4"/>
  <text x="640" y="130" class="res">Phe</text>
  <line x1="654" y1="242" x2="626" y2="295" class="dash" stroke="#246da8"/>
  <text x="720" y="177" class="small">π–π stacking</text>

  <text x="64" y="663" class="small">Conceptual diagram — geometry and distances are not experimental measurements.</text>
</svg>
